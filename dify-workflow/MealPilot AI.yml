            \ be false\n\n7. If missing ingredients exist:\n- grocery_required must\
            \ be true\n- add them to optimized_grocery_list\n\n8. Do NOT add unrelated\
            \ ingredients like chicken, quinoa, broccoli, etc. unless they appear\
            \ in Meal Intelligence missing_ingredients.\n\n9. Quantities should be\
            \ practical for family_size.\n\n10. Keep grocery list maximum 6 items.\n\
            \n11. Prefer budget-friendly Indian grocery assumptions.\n\n12. Estimate\
            \ prices in Indian Rupees only.\n\n13. If ingredient is a basic staple\
            \ like spices, oil, salt:\n- keep quantity small\n- mark priority as \"\
            medium\" unless essential\n\n14. If ingredient is required for main meal\
