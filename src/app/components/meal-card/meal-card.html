@if (meals.length) {

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

    @for (meal of meals; track meal.name) {

      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">

        <img
  [src]="getImage($index)"
          class="w-full h-40 object-cover">

        <div class="p-5">

          <h3 class="text-xl font-extrabold text-gray-900">
            {{ meal.name }}
          </h3>

          <p class="text-sm text-gray-600 mt-2">
            {{ meal.why_it_fits }}
          </p>

          <div class="grid grid-cols-2 gap-3 mt-5 text-sm">

            <div class="bg-gray-50 rounded-2xl p-3">
              <p class="text-gray-400">Time</p>
              <p class="font-bold">{{ meal.prep_time }}</p>
            </div>

            <div class="bg-gray-50 rounded-2xl p-3">
              <p class="text-gray-400">Protein</p>
              <p class="font-bold">{{ meal.protein }}</p>
            </div>

            <div class="bg-gray-50 rounded-2xl p-3">
              <p class="text-gray-400">Calories</p>
              <p class="font-bold">{{ meal.calories }}</p>
            </div>

            <div class="bg-gray-50 rounded-2xl p-3">
              <p class="text-gray-400">Pantry Use</p>
              <p class="font-bold">{{ meal.pantry_utilization }}</p>
            </div>

          </div>

        </div>

      </div>

    }

  </div>

}
