<div class="bg-white rounded-3xl shadow-lg p-6 space-y-4">

  <div>
    <p class="text-gray-500 text-sm mt-1">
      Enter your food context and let AI decide cook, groceries, order, or dineout.
    </p>
  </div>

  <div>
    <label class="text-sm font-medium">What do you want?</label>
    <textarea
      [(ngModel)]="form.userMessage"
      rows="3"
      class="w-full mt-1 border rounded-2xl p-3"
      placeholder="Suggest dinner for tonight">
    </textarea>
  </div>

  <div>
    <label class="text-sm font-medium">Pantry Ingredients at Home</label>
    <textarea
      [(ngModel)]="form.pantry"
      rows="4"
      class="w-full mt-1 border rounded-2xl p-3"
      placeholder="Paneer, wheat, tomatoes">
    </textarea>
  </div>

  <div>
    <label class="text-sm font-medium">Nutrition Goal</label>
    <input
      [(ngModel)]="form.nutritionGoal"
      class="w-full mt-1 border rounded-2xl p-3">
  </div>

  <div>
    <label class="text-sm font-medium">Cuisine</label>
    <input
      [(ngModel)]="form.cuisine"
      class="w-full mt-1 border rounded-2xl p-3">
  </div>

  <div class="grid grid-cols-3 gap-3">
    <div>
      <label class="text-sm font-medium">Budget</label>
      <input
        type="number"
        [(ngModel)]="form.budget"
        class="w-full mt-1 border rounded-2xl p-3">
    </div>

    <div>
      <label class="text-sm font-medium">Time</label>
      <input
        type="number"
        [(ngModel)]="form.cookingTime"
        class="w-full mt-1 border rounded-2xl p-3">
    </div>

    <div>
      <label class="text-sm font-medium">People</label>
      <input
        type="number"
        [(ngModel)]="form.familySize"
        class="w-full mt-1 border rounded-2xl p-3">
    </div>
  </div>

<button
  [disabled]="loading"
  (click)="onGenerate()"
  class="w-full bg-black text-white py-3 rounded-2xl font-semibold disabled:opacity-50 disabled:cursor-not-allowed">

  Generate Smart Plan

</button>

</div>
